name: focus_read
description: A distraction-free PDF reader
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  pdfx: ^2.7.0
  flutter_pdfview: ^1.3.2
  http: ^1.2.0
  path: ^1.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true




flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
